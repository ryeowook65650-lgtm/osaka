<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>首爾旅遊 2026</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F8FAFC">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* =========================================
           1. 高級原生 App 變數設定 (白底深藍風格)
           ========================================= */
        :root {
            --bg-color: #F4F6F9;         
            --card-bg: #FFFFFF;          
            --primary: #1E3A8A;          
            --primary-light: rgba(30, 58, 138, 0.08); 
            --secondary: #3B82F6;        
            --accent: #2563EB;           
            --text-main: #0F172A;        
            --text-muted: #64748B;       
            --border-color: rgba(15, 23, 42, 0.08);
            
            --color-success: #10B981;
            --color-danger: #EF4444;
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            
            --shadow-card: 0 8px 24px rgba(15, 23, 42, 0.04), 0 2px 8px rgba(15, 23, 42, 0.02);
            --shadow-btn: 0 6px 16px rgba(30, 58, 138, 0.2);
            --border-inner: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            
            --font-sans: 'Inter', 'Noto Sans TC', sans-serif;
            --font-serif: 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: var(--font-sans); }

        body { 
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overscroll-behavior-y: none;
        }

        button, input, select { appearance: none; -webkit-appearance: none; border: none; background: none; outline: none; margin: 0; padding: 0; touch-action: manipulation;}
        button { cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.2s; }
        button:active { transform: scale(0.94); opacity: 0.8; }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* =========================================
           2. 頂部狀態列
           ========================================= */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(248, 250, 252, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: calc(16px + env(safe-area-inset-top)) 24px 16px;
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
        }
        .app-header h1 { margin: 0; font-family: var(--font-serif); font-size: 28px; font-weight: 900; color: var(--primary); letter-spacing: 0.5px; }
        .app-header .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-top: 4px; display: block; letter-spacing: 1px; text-transform: uppercase;}
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .weather-pill { background: var(--card-bg); padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; box-shadow: var(--border-inner), var(--shadow-card); display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); color: var(--primary);}

        /* =========================================
           3. 底部導覽列
           ========================================= */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border-color); z-index: 999;
            display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
        }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); }
        .tab-btn i { font-size: 24px; transition: 0.2s; }
        .tab-btn span { font-size: 11px; font-weight: 700; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active i { filter: drop-shadow(0 0 8px rgba(30, 58, 138, 0.3)); }

        /* =========================================
           4. 視圖容器
           ========================================= */
        .view-container { 
            display: none; padding: 15px 20px 120px; flex-direction: column; gap: 20px; 
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        .view-container.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); filter: blur(4px);} to { opacity: 1; transform: translateY(0); filter: blur(0);} }

        .balance-card, .segment-wrapper, .bento-grid, .input-composite, .trip-card { margin: 0 !important; }

        /* =========================================
           5. 記帳與餘額
           ========================================= */
        .balance-card {
            background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
            border-radius: var(--radius-lg); padding: 24px; color: #FFF; 
            box-shadow: 0 16px 32px rgba(30, 58, 138, 0.25); position: relative; overflow: hidden;
        }
        .b-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 1px; position: relative; z-index: 2;}
        .b-title-right { display: flex; align-items: center; gap: 8px; }
        .rate-badge { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 8px; font-size: 11px; color: #E0E7FF; border: 1px solid rgba(255, 255, 255, 0.2);}

        .b-amount { font-family: var(--font-serif); font-size: 42px; font-weight: 900; margin: 8px 0 4px; line-height: 1.1; background: linear-gradient(135deg, #FFFFFF 0%, #DBEAFE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; z-index: 2;}
        .b-sub { font-size: 15px; color: #93C5FD; font-weight: 600; position: relative; z-index: 2;}

        .budget-wrapper { margin-top: 20px; position: relative; z-index: 2;}
        .budget-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
        .budget-track { height: 6px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; }
        .budget-fill { height: 100%; width: 0%; background: var(--color-success); border-radius: 99px; transition: width 1s ease, background-color 0.4s ease; }

        .segment-wrapper { background: rgba(15, 23, 42, 0.04); border-radius: 12px; display: flex; padding: 4px; border: 1px solid var(--border-color); overflow-x: auto;}
        .seg-btn { flex: 1; text-align: center; padding: 10px 12px; font-size: 13px; font-weight: 700; color: var(--text-muted); border-radius: 8px; transition: 0.3s; cursor: pointer; white-space: nowrap;}
        .seg-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08); border: 1px solid rgba(255,255,255,0.8); }
        .segment-wrapper::-webkit-scrollbar { display: none; }

        .section-title { font-size: 15px; font-weight: 800; margin: 5px 0 -5px; color: var(--primary); }
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .bento-box { background: var(--card-bg); border-radius: var(--radius-md); padding: 16px; text-align: center; border: 1px solid var(--border-color); box-shadow: var(--border-inner), var(--shadow-card); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s;}
        .bento-box.active { border: 2px solid var(--primary); background: rgba(30, 58, 138, 0.03); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 58, 138, 0.12);}
        .bento-icon { font-size: 32px; display: block; margin-bottom: 8px; color: var(--text-muted); transition: 0.2s;}
        .bento-box.active .bento-icon { color: var(--primary); transform: scale(1.1);}
        .bento-label { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        .bento-box.active .bento-label { color: var(--primary); }

        .input-composite { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); }
        .input-row { display: flex; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 12px; }
        .input-row input { flex: 1; font-size: 16px; font-weight: 600; color: var(--text-main); }
        .input-row input::placeholder { color: #94A3B8; font-weight: 500;}
        .price-action-row { display: flex; align-items: center; justify-content: space-between; }
        .price-input-wrapper { display: flex; align-items: center; background: var(--bg-color); border-radius: 12px; padding: 12px 16px; flex: 1; margin-right: 12px; border: inset 1px rgba(0,0,0,0.02);}
        .curr-toggle { font-weight: 800; font-size: 18px; color: var(--primary); margin-right: 12px; padding-right: 12px; border-right: 2px solid var(--border-color); user-select: none; cursor: pointer; transition: 0.2s; }
        .curr-toggle:active { transform: scale(0.85); opacity: 0.7; }
        .price-input-wrapper input { font-size: 24px; font-weight: 800; width: 100%; color: var(--text-main); }
        .price-input-wrapper input::placeholder { color: #94A3B8; font-weight: 500;}
        .submit-fab { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%); color: #FFF; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), var(--shadow-btn); flex-shrink: 0;}

        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .h-item { background: var(--card-bg); padding: 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); box-shadow: var(--shadow-card);}
        .h-left { display: flex; align-items: center; gap: 12px; }
        .h-icon { width: 44px; height: 44px; background: var(--bg-color); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px;}
        .h-info h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--text-main); }
        .h-tag { font-size: 10px; background: var(--primary-light); color: var(--primary); padding: 3px 6px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px;}
        .h-right { text-align: right; display: flex; align-items: center;}
        .h-price-box { display: flex; flex-direction: column; align-items: flex-end;}
        .h-price { font-family: var(--font-serif); font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 2px;}
        .h-jpy { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .h-del { color: var(--text-muted); padding: 10px; margin-left: 5px; font-size: 20px; transition: 0.2s; border:none; background:none; cursor:pointer;}
        .h-del:active { color: var(--color-danger); }

        /* =========================================
           6. 行程版面 
           ========================================= */
        .trip-card { background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--border-inner), var(--shadow-card); border: 1px solid var(--border-color); position: relative;}
        .trip-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary));}
        
        .t-body { padding: 24px; }
        .t-time { font-size: 11px; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        .t-title { font-family: var(--font-serif); font-size: 22px; font-weight: 900; margin: 0 0 20px; line-height: 1.4; color: var(--text-main); }
        
        .info-block { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); }
        .info-block.addr-block { background: rgba(15, 23, 42, 0.02); }
        .info-block.transport-block { background: rgba(30, 58, 138, 0.04); border-color: rgba(30, 58, 138, 0.1); }
        .info-block.note-block { background: rgba(59, 130, 246, 0.06); border-color: rgba(59, 130, 246, 0.15); }
        
        .i-icon { font-size: 22px; color: var(--text-muted); margin-top: 2px; }
        .transport-block .i-icon { color: var(--primary); }
        .note-block .i-icon { color: var(--secondary); }
        .i-text { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-main); line-height: 1.6; }

        .subway-step { display: block; position: relative; padding-left: 16px; margin-bottom: 10px; border-left: 2px solid rgba(15, 23, 42, 0.1); line-height: 1.5; }
        .subway-step:last-child { border-left-color: transparent; margin-bottom: 0; }
        .subway-step::before { content: ''; position: absolute; left: -5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); border: 2px solid #FFF; }
        .subway-station { font-weight: 800; color: var(--text-main); background: var(--bg-color); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; margin: 0 4px; display: inline-block;}
        .subway-line { color: var(--primary); font-weight: 800; font-size: 13px; }

        .cost-tag { display: inline-block; background-color: rgba(30, 58, 138, 0.05); color: var(--primary); padding: 4px 8px; font-size: 12px; font-weight: 800; border-radius: 6px; margin-top: 10px; border: 1px solid rgba(30, 58, 138, 0.2); letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <header class="app-header">
        <div>
            <h1>Seoul 2026</h1>
            <span class="subtitle">7月16日 - 7月20日</span>
        </div>
        <div class="header-actions">
            <div class="weather-pill">🇰🇷 載入天氣中...</div>
        </div>
    </header>

    <main>
        <section id="view-accounting" class="view-container active">
            <div class="balance-card">
                <div class="b-title">
                    <span>Total Expenses</span>
                    <div class="b-title-right">
                        <span class="rate-badge" id="rate-display">即時匯率 載入中</span>
                    </div>
                </div>
                <h2 class="b-amount" id="total-primary">NT$ 0</h2>
                <div class="b-sub" id="total-secondary">≈ ₩ 0</div>
                <div class="budget-wrapper">
                    <div class="budget-info">
                        <span id="budget-rem-label">剩餘 NT$ 30,000</span>
                        <span class="budget-tot">/ 30k 預算</span>
                    </div>
                    <div class="budget-track"><div class="budget-fill" id="budget-fill"></div></div>
                </div>
            </div>

            <!-- 日期選擇 -->
            <div class="segment-wrapper" id="date-segment">
                <button class="seg-btn active" onclick="selectDate('7/16', this)">7/16</button>
                <button class="seg-btn" onclick="selectDate('7/17', this)">7/17</button>
                <button class="seg-btn" onclick="selectDate('7/18', this)">7/18</button>
                <button class="seg-btn" onclick="selectDate('7/19', this)">7/19</button>
                <button class="seg-btn" onclick="selectDate('7/20', this)">7/20</button>
            </div>

            <!-- 人員選擇 -->
            <div class="segment-wrapper" id="person-segment">
                <button class="seg-btn active" onclick="selectPerson('', this)">👥 共用</button>
                <button class="seg-btn" onclick="selectPerson('阿珊', this)">👧 阿珊</button>
                <button class="seg-btn" onclick="selectPerson('小爸', this)">🦭 小爸</button>
                <button class="seg-btn" onclick="selectPerson('阿馨', this)">🐹 阿馨</button>
                <button class="seg-btn" onclick="selectPerson('阿雪', this)">🐵 阿雪</button>
            </div>

            <h3 class="section-title">選擇分類</h3>
            <div class="bento-grid" id="category-container">
                <button class="bento-box active" onclick="selectCategory('交通', this)"><i class="ph-fill ph-taxi bento-icon"></i><span class="bento-label">交通</span></button>
                <button class="bento-box" onclick="selectCategory('食物', this)"><i class="ph-fill ph-hamburger bento-icon"></i><span class="bento-label">食物</span></button>
                <button class="bento-box" onclick="selectCategory('購物', this)"><i class="ph-fill ph-tote bento-icon"></i><span class="bento-label">購物</span></button>
                <button class="bento-box" onclick="selectCategory('其他', this)"><i class="ph-fill ph-sparkle bento-icon"></i><span class="bento-label">其他</span></button>
            </div>

            <h3 class="section-title">記下一筆</h3>
            <div class="input-composite">
                <div class="input-row"><input type="text" id="item-name" placeholder="品項名稱 (選填)"></div>
                <div class="price-action-row">
                    <div class="price-input-wrapper">
                        <!-- 切換幣值 -->
                        <div class="curr-toggle" id="curr-toggle" onclick="toggleCurrency()">₩</div>
                        <input type="number" id="item-price" placeholder="輸入韓元" min="0" step="0.01">
                    </div>
                    <button class="submit-fab" onclick="addExpense()"><i class="ph-bold ph-plus"></i></button>
                </div>
            </div>

            <h3 class="section-title">今日紀錄</h3>
            <div id="expense-list" class="history-list"></div>
        </section>

        <section id="view-itinerary" class="view-container">
            <div class="segment-wrapper">
                <button class="seg-btn active" onclick="switchDay('day1', this)">D1</button>
                <button class="seg-btn" onclick="switchDay('day2', this)">D2</button>
                <button class="seg-btn" onclick="switchDay('day3', this)">D3</button>
                <button class="seg-btn" onclick="switchDay('day4', this)">D4</button>
                <button class="seg-btn" onclick="switchDay('day5', this)">D5</button>
            </div>
            <div id="itinerary-content"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="tab-btn active" id="tab-accounting" onclick="switchTab('accounting')"><i class="ph-fill ph-wallet"></i><span>記帳</span></button>
        <button class="tab-btn" id="tab-itinerary" onclick="switchTab('itinerary')"><i class="ph-fill ph-map-trifold"></i><span>行程</span></button>
    </nav>

    <script>
        // ==========================================
        // Google Apps Script Webhook URL
        // ==========================================

        // 預設匯率與預算
        let KRW_RATE = 0.024;

        const ITINERARY_DATA = {

                { time: "預估 15 分鐘", title: "明洞商圈逛街吃晚餐", address: "首爾特別市中區明洞", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">步行到 <span class=\"subway-station\">忠武路站</span></span><span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵4號線</span></span><span class=\"subway-step\">搭到 <span class=\"subway-station\">明洞站</span></span>", icon2: "<i class='ph-fill ph-umbrella'></i>", info2: "如下雨可多逛樂天免稅店或在室內吃明洞餃子、神仙雪濃湯" }
            ],
            day2: [
                { time: "預估 30 分鐘", title: "逛街: The Hyundai Seoul 現代百貨", address: "首爾特別市永登浦區汝矣大路108", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵5號線</span> (乙支路4街站上車)</span><span class=\"subway-step\">搭到 <span class=\"subway-station\">汝矣渡口站</span></span>", icon2: "<i class='ph-fill ph-tote'></i>", info2: "【室內雨備首選】首爾最大最美百貨，超多潮牌、美食與室內植物園" },
                { time: "預估 30 分鐘", title: "逛街: COEX 星空圖書館 & 水族館", address: "首爾特別市江南區永東大路513", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵9號線</span> 轉 <span class=\"subway-line\">地鐵2號線</span></span><span class=\"subway-step\">搭到 <span class=\"subway-station\">三成站</span> 5/6號出口</span>", icon2: "<i class='ph-fill ph-books'></i>", info2: "【全室內行程】拍巨型書牆，逛巨大地下商城，下雨完全不怕" }
            ],
            day3: [
                { time: "預估 50 分鐘", title: "採買: 金浦現代 Premium Outlet", address: "京畿道金浦市高村邑Ara陸路152番街100", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵5號線</span></span><span class=\"subway-step\">至 <span class=\"subway-station\">傍花站</span> 換乘公車 16號</span>", icon2: "<i class='ph-fill ph-bag'></i>", info2: "【購物行程】擁有許多國際大牌與運動品牌，有雨遮步道方便逛街" },
                { time: "傍晚", title: "晚餐: 弘大商圈", address: "首爾特別市麻浦區弘益大學周邊", icon1: "<i class='ph-fill ph-train'></i>", info1: "從 Outlet 離開後可搭車前往弘大商圈", icon2: "<i class='ph-fill ph-coffee'></i>", info2: "逛逛美妝服飾，找間舒適的室內咖啡廳或烤肉店吃晚餐" }
            ],
            day4: [
                { time: "預估 20 分鐘", title: "逛街: Goto Mall 江南地下街", address: "首爾特別市瑞草區新盤浦路200", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵3號線</span> (忠武路站上車)</span><span class=\"subway-step\">搭到 <span class=\"subway-station\">高速巴士客運站</span></span>", icon2: "<i class='ph-fill ph-t-shirt'></i>", info2: "【全室內行程】首爾規模最大的地下街，服飾超便宜且完全不受天氣影響" },
                { time: "下午", title: "景點: 樂天世界 Lotte World", address: "首爾特別市松坡區奧林匹克路240", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵2號線</span></span><span class=\"subway-step\">搭到 <span class=\"subway-station\">蠶室站</span> 4號出口</span>", icon2: "<i class='ph-fill ph-ticket'></i>", info2: "【室內樂園】擁有巨大的室內探險世界，雨天遊樂的最佳去處" }
            ],
            day5: [
                { time: "預估 20 分鐘", title: "伴手禮: 樂天超市 (首爾站店)", address: "首爾特別市中區青坡路426", icon1: "<i class='ph-fill ph-train'></i>", info1: "<span class=\"subway-step\">搭乘 <span class=\"subway-line\">地鐵4號線</span> (忠武路站上車)</span><span class=\"subway-step\">搭到 <span class=\"subway-station\">首爾站</span> 1號出口</span>", icon2: "<i class='ph-fill ph-gift'></i>", info2: "室內大型超市，買泡麵零食伴手禮，滿額可直接辦理退稅" },
                { time: "行程結束", title: "前往機場準備回程", address: "仁川國際機場", icon1: "<i class='ph-fill ph-airplane-tilt'></i>", info1: "搭乘機場快線(AREX)或機場巴士", icon2: "<i class='ph-fill ph-heart'></i>", info2: "首爾之旅圓滿結束" }
            ]
        };

        // 狀態管理
        let state = {
            date: '7/16',
            person: '',
            category: '交通',
            inputCurrency: 'KRW', // 追蹤目前輸入的是韓元還是台幣
            expenses: [] 
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchRealTimeExchangeRate();
            const stored = localStorage.getItem('seoul_expenses_v4');
            if (stored) {
                state.expenses = JSON.parse(stored);
            }
            updateExpenseList();
            renderItinerary('day1');
            
            const weatherEmoji = Math.random() > 0.5 ? "🌧️ 首爾 24°C" : "☁️ 首爾 26°C";
            document.querySelector('.weather-pill').innerText = weatherEmoji;
        });

        async function fetchRealTimeExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/KRW');
                const data = await response.json();
                if (data && data.rates && data.rates.TWD) {
                    KRW_RATE = data.rates.TWD;
                    document.getElementById('rate-display').innerText = `即時匯率 ${KRW_RATE.toFixed(4)}`;
                }
            } catch (error) {
                console.log('無法取得即時匯率，使用預設值。', error);
                document.getElementById('rate-display').innerText = `預設匯率 ${KRW_RATE}`;
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');

            document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
        }

        function selectDate(date, el) {
            state.date = date;
            document.querySelectorAll('#date-segment .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            updateExpenseList();
        }

        function selectPerson(person, el) {
            state.person = person;
            document.querySelectorAll('#person-segment .seg-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        function selectCategory(cat, el) {
            state.category = cat;
            document.querySelectorAll('#category-container .bento-box').forEach(box => box.classList.remove('active'));
            el.classList.add('active');
        }

        // 切換幣值的函數
        function toggleCurrency() {
            const toggleEl = document.getElementById('curr-toggle');
            const inputEl = document.getElementById('item-price');
            
            if (state.inputCurrency === 'KRW') {
                state.inputCurrency = 'TWD';
                toggleEl.innerText = 'NT$';
                inputEl.placeholder = '輸入台幣';
            } else {
                state.inputCurrency = 'KRW';
                toggleEl.innerText = '₩';
                inputEl.placeholder = '輸入韓元';
            }
        }

        function addExpense() {
            const priceInput = document.getElementById('item-price');
            const nameInput = document.getElementById('item-name');
            const inputVal = parseFloat(priceInput.value);
            
            if (isNaN(inputVal) || inputVal <= 0) {
                alert('請輸入正確的金額');
                return;
            }

            let krwVal, twdVal;

            // 根據當前選擇的幣值來換算
            if (state.inputCurrency === 'KRW') {
                krwVal = inputVal;
                twdVal = Math.round(inputVal * KRW_RATE);
            } else {
                twdVal = inputVal;
                krwVal = Math.round(inputVal / KRW_RATE); // 若輸入台幣，反推韓元
            }

            const nameVal = nameInput.value.trim() || state.category;

            const newExpense = {
                id: Date.now().toString(),
                date: state.date,
                person: state.person,
                category: state.category,
                name: nameVal,
                krw: krwVal,
                twd: twdVal
            };

            state.expenses.push(newExpense);
            localStorage.setItem('seoul_expenses_v4', JSON.stringify(state.expenses));

            // 發送到 Google Sheets
            if (GOOGLE_SHEET_WEBHOOK_URL && GOOGLE_SHEET_WEBHOOK_URL.includes('/s/')) {
                fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newExpense)
                }).catch(e => console.log('傳送至試算表失敗', e));
            }

            priceInput.value = '';
            nameInput.value = '';

            updateExpenseList();
        }

        function deleteExpense(id) {
            if(confirm('確定要刪除這筆花費嗎？')){
                state.expenses = state.expenses.filter(e => e.id !== id);
                localStorage.setItem('seoul_expenses_v4', JSON.stringify(state.expenses));
                updateExpenseList();
            }
        }

        function updateExpenseList() {
            const listEl = document.getElementById('expense-list');
            listEl.innerHTML = '';

            let totalTwd = 0;
            let totalKrw = 0;

            state.expenses.forEach(e => {
                totalTwd += e.twd;
                totalKrw += e.krw;
            });

            document.getElementById('total-primary').innerText = `NT$ ${totalTwd.toLocaleString()}`;
            document.getElementById('total-secondary').innerText = `≈ ₩ ${totalKrw.toLocaleString()}`;
            
            let rem = BUDGET - totalTwd;
            document.getElementById('budget-rem-label').innerText = `剩餘 NT$ ${rem.toLocaleString()}`;
            
            let percent = Math.min((totalTwd / BUDGET) * 100, 100);
            const fillEl = document.getElementById('budget-fill');
            fillEl.style.width = percent + '%';
            fillEl.style.backgroundColor = percent > 90 ? 'var(--color-danger)' : 'var(--color-success)';

            const todaysExpenses = state.expenses.filter(e => e.date === state.date).reverse();

            if (todaysExpenses.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:14px;">今日尚無花費紀錄</div>';
                return;
            }

            todaysExpenses.forEach(item => {
                let iconClass = 'ph-sparkle';
                if (item.category === '交通') iconClass = 'ph-taxi';
                if (item.category === '食物') iconClass = 'ph-hamburger';
                if (item.category === '購物') iconClass = 'ph-tote';

                const personTag = item.person ? `<span class="h-tag">${item.person}</span>` : `<span class="h-tag">共用</span>`;

                const html = `
                    <div class="h-item">
                        <div class="h-left">
                            <div class="h-icon"><i class="ph-fill ${iconClass}"></i></div>
                            <div class="h-info">
                                <h4>${item.name}</h4>
                                ${personTag}
                            </div>
                        </div>
                        <div class="h-right">
                            <div class="h-price-box">
                                <div class="h-price">NT$ ${item.twd.toLocaleString()}</div>
                                <div class="h-jpy">₩ ${item.krw.toLocaleString()}</div>
                            </div>
                            <button class="h-del" onclick="deleteExpense('${item.id}')"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderItinerary(dayId) {
            const container = document.getElementById('itinerary-content');
            container.innerHTML = '';
            const data = ITINERARY_DATA[dayId];

            data.forEach(stop => {
                const html = `
                    <div class="trip-card">
                        <div class="t-body">
                            <span class="t-time">${stop.time}</span>
                            <h3 class="t-title">${stop.title}</h3>
                            
                            <div class="info-block addr-block">
                                <i class="ph-fill ph-map-pin i-icon"></i>
                                <div class="i-text">${stop.address}</div>
                            </div>
                            
                            <div class="info-block transport-block">
                                ${stop.icon1}
                                <div class="i-text">${stop.info1}</div>
                            </div>
                            
                            ${stop.info2 ? `
                            <div class="info-block note-block">
                                ${stop.icon2}
                                <div class="i-text">${stop.info2}</div>
                            </div>` : ''}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }
    </script>
</body>
</html>
